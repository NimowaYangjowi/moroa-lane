<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Luma &amp; Leaf</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Luma & Leaf">
    <meta name="mobile-web-app-capable" content="yes">
        

    


    <link rel="icon" href="/channeltalk/icon.png" type="image/png">
    <link rel="icon" href="/channeltalk/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/channeltalk/icon.png">

    <link rel="stylesheet" href="/channeltalk/assets/application.css" data-turbo-track="reload" />
    

  </head>

  <body>
    <header class="site-header">
      <a class="brand-link" href="/channeltalk/">Luma &amp; Leaf</a>
      <nav class="site-nav" aria-label="Primary">
        <a href="/channeltalk/products/">Shop</a>
        <a href="/channeltalk/#scope">About</a>
          <a href="/channeltalk/session/new/">Log in</a>
          <a href="/channeltalk/registration/new/">Join</a>
      </nav>
    </header>

    <main>

      <section class="auth-shell">
  <div class="auth-panel">
    <p class="eyebrow">Member identity</p>
    <h1>Log in to become a known customer.</h1>
    <p>
      Keep your cart, recent product views, and order history ready whenever you need help.
    </p>

    <form class="form-stack" data-turbo="false" autocomplete="off" action="#" accept-charset="UTF-8" method="post">      <label>
        Email
        <input type="text" name="login_email" id="login_email" value="jiwoo@example.com" required="required" autofocus="autofocus" inputmode="email" autocomplete="off" autocapitalize="none" spellcheck="false" />
      </label>

      <label>
        Password
        <input type="password" name="login_password" id="login_password" value="password123" required="required" autocomplete="off" maxlength="72" />
      </label>

      <input type="submit" name="commit" value="Log in" class="button" data-disable-with="Log in" />
</form>
    <div class="auth-links">
      <a href="/channeltalk/registration/new/">Create an account</a>
      <a href="#">Forgot password?</a>
    </div>
  </div>
</section>

    </main>

      <a class="channel-fallback-button" href="/channeltalk/care/">Chat with us</a>
  </body>
</html>
