    <main>

      <section class="auth-shell">
  <div class="auth-panel">
    <p class="eyebrow">Create member</p>
    <h1>Join Acme Corp.</h1>
    <p>
      Create an account to keep your routine preferences, cart, and order history in one place.
    </p>


    <form class="form-stack" data-turbo="false" action="#" accept-charset="UTF-8" method="post">      <label>
        Name
        <input required="required" autocomplete="name" placeholder="Jiwoo Han" type="text" name="user[name]" id="user_name" />
      </label>

      <label>
        Email
        <input required="required" autocomplete="username" placeholder="jiwoo@example.com" type="email" name="user[email_address]" id="user_email_address" />
      </label>

      <label>
        Skin type
        <select required="required" name="user[skin_type]" id="user_skin_type"><option value="" label=" "></option>
<option value="Dry skin">Dry skin</option>
<option value="Sensitive skin">Sensitive skin</option>
<option value="Combination skin">Combination skin</option>
<option value="Oily skin">Oily skin</option>
<option value="Normal skin">Normal skin</option></select>
      </label>

      <label>
        Password
        <input required="required" autocomplete="new-password" placeholder="At least 8 characters" maxlength="72" size="72" type="password" name="user[password]" id="user_password" />
      </label>

      <label>
        Confirm password
        <input required="required" autocomplete="new-password" placeholder="Repeat password" maxlength="72" size="72" type="password" name="user[password_confirmation]" id="user_password_confirmation" />
      </label>

      <input type="submit" name="commit" value="Create account" class="button" data-disable-with="Create account" />
</form>  </div>
</section>

    </main>

      <script>
        (function(){var w=window;if(w.ChannelIO){return w.console.error("ChannelIO script included twice.");}var ch=function(){ch.c(arguments);};ch.q=[];ch.c=function(args){ch.q.push(args);};w.ChannelIO=ch;function l(){if(w.ChannelIOInitialized){return;}w.ChannelIOInitialized=true;var s=document.createElement("script");s.type="text/javascript";s.async=true;s.src="https://cdn.channel.io/plugin/ch-plugin-web.js";var x=document.getElementsByTagName("script")[0];if(x.parentNode){x.parentNode.insertBefore(s,x);}}if(document.readyState==="complete"){l();}else{w.addEventListener("DOMContentLoaded",l);w.addEventListener("load",l);}})();
        var channelBootOptions = {"pluginKey":"09dd96fd-3ff2-4476-a37f-916102b26183","language":"en"};

        function clearChannelTalkBrowserState() {
          try {
            Object.keys(window.localStorage || {}).forEach(function(key) {
              if (key.indexOf("Channel.") === 0) { window.localStorage.removeItem(key); }
            });
            Object.keys(window.sessionStorage || {}).forEach(function(key) {
              if (key.indexOf("Channel.") === 0) { window.sessionStorage.removeItem(key); }
            });
            document.cookie = "_channeltalk_session=; Max-Age=0; path=/; SameSite=Lax";
          } catch (error) {
            console.warn("ChannelTalk browser state cleanup failed", error);
          }
        }

        function bootChannelTalk() {
          ChannelIO("boot", channelBootOptions, function(error) {
            if (error) { console.error("ChannelTalk boot failed", error); }
          });
        }

        bootChannelTalk();

        document.addEventListener("submit", function(event) {
          var form = event.target;
          if (!form.matches("[data-channel-logout-form]")) { return; }

          if (window.ChannelIO) {
            clearChannelTalkBrowserState();
            ChannelIO("shutdown");
          }
        }, true);
      </script>
